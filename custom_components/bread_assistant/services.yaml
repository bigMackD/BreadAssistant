start_bake:
  fields:
    recipe_id:
      example: justyna_basic_wheat_sourdough
      selector:
        text: null
    start_time:
      example: '2026-11-14T11:00:00+01:00'
      selector:
        text: null
    starter_id:
      selector:
        text: null
    starter_workflow:
      default: feed
      selector:
        select:
          options:
          - feed
          - prepared
          translation_key: starter_workflow
    starter_ready:
      default: false
      selector:
        boolean: null
complete_step:
  fields:
    bake_id: &id001
      required: true
      selector:
        text: null
    step_id: &id002
      required: true
      selector:
        text: null
snooze_step:
  fields:
    bake_id: *id001
    step_id: *id002
    minutes:
      required: true
      selector:
        number:
          min: 1
          max: 1440
          mode: box
adjust_step:
  fields:
    bake_id: *id001
    step_id: *id002
    due_at:
      required: true
      selector:
        text: null
pause_bake:
  fields:
    bake_id: *id001
resume_bake:
  fields:
    bake_id: *id001
cancel_bake:
  fields:
    bake_id: *id001
